# Build the USB HID -> Virtual 8042 Port Bridge UEFI firmware on GitHub Actions.
#
# We build exclusively on GitHub Actions (Ubuntu). Ubuntu's binutils ships the
# `efi-app-x86_64` objcopy target, so `objcopy --target=efi-app-x86_64` produces
# a correct UEFI image directly from the linked .so - no post-processing needed.
#
# Artifacts:
#   bridge-efi       -> build/bridge.efi            (normal, silent on success)
#   bridge-debug-efi -> build-debug/bridge-debug.efi (prints XHCI state on bring-up)
#   bootable         -> build/bootable/EFI/BOOT/BOOTX64.EFI (staged for a FAT32 USB stick)

name: Build UEFI firmware

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnu-efi binutils gcc make python3

      - name: Build firmware (normal + debug)
        run: |
          make build/bridge.efi
          make build-debug/bridge-debug.efi

      - name: Run host unit tests (Layer 0)
        run: make test

      - name: Stage bootable image
        run: make bootable DEBUG=0

      - name: Upload normal EFI
        uses: actions/upload-artifact@v4
        with:
          name: bridge-efi
          path: build/bridge.efi
          if-no-files-found: error

      - name: Upload debug EFI
        uses: actions/upload-artifact@v4
        with:
          name: bridge-debug-efi
          path: build-debug/bridge-debug.efi
          if-no-files-found: error

      - name: Upload bootable tree
        uses: actions/upload-artifact@v4
        with:
          name: bootable
          path: build/bootable/
          if-no-files-found: error

  # Boot the built firmware in QEMU + OVMF and assert the bridge genuinely
  # brings up XHCI. This is the automated equivalent of the manual "did you
  # test on OVMF?" check: it runs the exact artifact the build job produced
  # (built on Ubuntu with the correct efi-app-x86_64 objcopy target) and fails
  # the workflow if the bridge does not report a successful XHCI bring-up.
  #
  # We test the DEBUG build because it emits a strong, unambiguous success
  # signal: "*** BRIDGE OK: XHCI bring-up succeeded ***" is printed only when
  # the bridge core actually ran XHCI bring-up and published its status record
  # (src/uefi/l1_harness.c print_bridge_status). The normal build's "Bridge
  # setup complete" is weaker - it is also printed if the bridge never started
  # (wait_for_bridge_fault returns NULL on timeout), which would be a false
  # positive. Failure signals we look for: "BRIDGE FAULT", "ERROR:", or an x86
  # exception (#GP/#PF) from a malformed image.
  ovmf-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Install QEMU + OVMF + mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools

      - name: Download debug EFI artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-debug-efi
          path: efi

      - name: Create FAT32 disk image with the EFI app
        run: |
          rm -f /tmp/bridge.img
          truncate -s 64M /tmp/bridge.img
          mkfs.vfat -F 32 -n BRIDGE /tmp/bridge.img
          mmd -i /tmp/bridge.img ::/EFI
          mmd -i /tmp/bridge.img ::/EFI/BOOT
          mcopy -i /tmp/bridge.img efi/bridge-debug.efi ::/EFI/BOOT/BOOTX64.EFI

      # Verify the disk image actually contains the artifact before we boot it.
      # This catches two classes of silent failure that would otherwise look
      # identical to a firmware bug:
      #   1. The artifact download produced a file with a different name/path
      #      than `efi/bridge-debug.efi`, so mcopy copied nothing (or the wrong
      #      file) and the disk has no BOOTX64.EFI -> OVMF "Not Found".
      #   2. The artifact is not a valid PE32+ EFI application (subsystem 10),
      #      so even if it is on the disk OVMF cannot load it.
      - name: Verify disk image contains a valid EFI app
        run: |
          echo "=== Downloaded artifact tree ==="
          find efi -type f -exec ls -la {} \;
          echo "=== Disk image directory listing ==="
          mdir -i /tmp/bridge.img ::/EFI/BOOT/
          echo "=== Check BOOTX64.EFI is present on the disk ==="
          if ! mdir -i /tmp/bridge.img ::/EFI/BOOT/ | grep -qi "BOOTX64"; then
            echo "ERROR: BOOTX64.EFI not found on disk image"
            exit 1
          fi
          echo "=== Extract BOOTX64.EFI from the disk and inspect it ==="
          mcopy -i /tmp/bridge.img ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          ls -la /tmp/BOOTX64.EFI
          file /tmp/BOOTX64.EFI || true
          echo "=== PE subsystem check (must be 10 = EFI application) ==="
          objdump -p /tmp/BOOTX64.EFI 2>/dev/null | grep -iE "Subsystem|Magic|SizeOfOptionalHeader" || true
          echo "=== Compare on-disk file to the downloaded artifact ==="
          cmp /tmp/BOOTX64.EFI efi/bridge-debug.efi && echo "MATCH: on-disk BOOTX64.EFI is byte-identical to the artifact" || echo "DIFFER: on-disk BOOTX64.EFI differs from the artifact"

      # Boot the EFI app in OVMF and capture the serial/console log. This is a
      # standalone step so the log-file readback (next step) can run as its own
      # check. The readback only makes sense in OVMF (where we can inspect the
      # USB drive image after boot) - it does not apply to real hardware, where
      # the log file lives on the physical USB stick.
      - name: Boot in OVMF
        run: |
          # The ovmf package names its firmware files differently across Ubuntu
          # versions (OVMF_CODE.fd/OVMF_VARS.fd vs the 4M variants). Detect
          # whichever pair is present so the QEMU pflash drives are correct.
          if [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            echo "ERROR: no OVMF firmware found under /usr/share/OVMF/"
            ls -la /usr/share/OVMF/ || true
            exit 1
          fi
          echo "Using OVMF code: $OVMF_CODE"
          echo "Using OVMF vars: $OVMF_VARS"
          cp "$OVMF_VARS" /tmp/ovmf_vars.fd
          # -smp 2 so the bridge has a real "highest core" to bring up via SIPI.
          # qemu-xhci provides an XHCI >= 1.0 controller (the bridge's C6
          # requirement); usb-kbd/usb-mouse attach to it and are enumerated by
          # OVMF's USB stack so U1 can discover them via EFI_USB_IO_PROTOCOL.
          # -nographic routes the UEFI console (ConOut) to stdio so the bridge's
          # Print() output is captured. The debug build writes its diagnostics
          # to the log file, so we let it run to the timeout and grep the
          # captured log.
          # Boot the EFI app from a USB drive (not IDE). This is required so
          # the robust log-file writer (src/uefi/log_file.c) can activate: it
          # only enables itself when the boot device is verified to be a
          # removable USB drive AND it is the same drive the app was booted
          # from. Booting from IDE would make the log writer a silent no-op.
          #
          # The disk image is attached as a USB mass-storage device:
          #   -drive if=none,id=usbstick,... + -device usb-storage,drive=usbstick
          # The usb-storage device is a USB Mass Storage Class device that
          # OVMF's USB stack enumerates as a removable USB drive, so the
          # device-path (MSG_USB_DP) and BlockIo RemovableMedia checks pass.
          # qemu-xhci provides the XHCI >= 1.0 controller the bridge requires.
          #
          # We run QEMU in the BACKGROUND with an HMP monitor socket so we can
          # inject USB HID input (sendkey / mouse_move / mouse_button) while it
          # runs. Without injection the usb-kbd/usb-mouse devices enumerate but
          # never produce a transfer event, so the bridge observer sees nothing.
          # We send input REPEATEDLY but SLOWLY (a key/mouse event every ~1.5s)
          # so the bridge AP has time to observe each completed transfer and
          # translate it to PS/2 before the next one arrives.
          rm -f /tmp/qemu-mon /tmp/ovmf.log
          timeout 45 qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 512M \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/ovmf_vars.fd \
            -drive if=none,id=usbstick,format=raw,file=/tmp/bridge.img \
            -device qemu-xhci \
            -device usb-storage,drive=usbstick \
            -device usb-kbd \
            -device usb-mouse \
            -nographic \
            -serial stdio \
            -monitor unix:/tmp/qemu-mon,server,nowait > /tmp/ovmf.log 2>&1 &
          QEMU_PID=$!

          # Wait for the bridge to come up (OVMF boot + app setup + AP bring-up).
          # The log shows "Bridge setup complete" once the BSP has finished setup
          # and the AP is polling. Poll the log for it (bounded).
          echo "Waiting for bridge setup to complete..."
          for i in $(seq 1 60); do
            if grep -q "Bridge setup complete" /tmp/ovmf.log 2>/dev/null; then
              echo "Bridge setup complete detected after ${i}s"
              break
            fi
            sleep 1
          done

          # Inject USB HID input repeatedly but slowly via the HMP monitor.
          # Each sendkey/mouse event produces a transfer on the interrupt IN
          # endpoint that the bridge observer polls. We sleep between sends so
          # the bridge has time to observe + translate each one.
          python3 - <<'PYEOF'
          import socket, time, sys

          def hmp(cmd):
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.settimeout(2)
                  s.connect("/tmp/qemu-mon")
                  s.sendall((cmd + "\n").encode())
                  time.sleep(0.2)
                  s.close()
              except Exception as e:
                  print("hmp send failed: %s" % e, file=sys.stderr)

          keys = ["a", "b", "c", "1", "2", "3", "spc", "ret", "esc", "tab"]
          # Wait a moment for the AP to be polling before the first event.
          time.sleep(2)
          for i in range(6):
              k = keys[i % len(keys)]
              print("sendkey %s" % k)
              hmp("sendkey %s" % k)
              time.sleep(1.5)
              # Mouse: move then click (press + release).
              x = 50 + i * 20
              y = 50 + i * 10
              print("mouse_move %d %d" % (x, y))
              hmp("mouse_move %d %d" % (x, y))
              time.sleep(1.5)
              print("mouse_button 1")
              hmp("mouse_button 1")
              time.sleep(0.5)
              print("mouse_button 0")
              hmp("mouse_button 0")
              time.sleep(1.5)
          print("input injection complete")
          PYEOF

          # Wait for QEMU to finish (timeout kills it at 45s).
          wait $QEMU_PID || true
          echo "=== OVMF boot log ==="
          cat /tmp/ovmf.log

      # Verify the robust log writer created bridge-debug.log on the USB drive
      # and read it back. This is a separate step after boot (OVMF-only - it
      # inspects the USB drive image, which does not apply to real hardware).
      # It runs BEFORE the XHCI bring-up check so we always verify the log
      # writer even if the (separate, known) bridge-core bring-up has not been
      # implemented yet and the XHCI check fails. The log writer only activates
      # on a removable USB boot drive, so its presence proves the USB-boot path
      # exercised it.
      - name: Verify log file readback
        run: |
          echo "=== Checking bridge-debug.log was written to the USB drive ==="
          mdir -i /tmp/bridge.img ::/ || true
          if mdir -i /tmp/bridge.img ::/ | grep -qi "bridge-debug.log"; then
            echo "LOG WRITER OK: bridge-debug.log present on the USB drive"
            echo "--- bridge-debug.log contents ---"
            mtype -i /tmp/bridge.img ::/bridge-debug.log || true
            echo "--- end of bridge-debug.log ---"
          else
            echo "LOG WRITER FAILED: bridge-debug.log not found on the USB drive"
            echo "The log writer did not activate or did not write the file."
            exit 1
          fi

      - name: Check for XHCI bring-up success
        run: |
          echo "=== Checking for XHCI bring-up success ==="
          if grep -q "BRIDGE OK: XHCI bring-up succeeded" /tmp/ovmf.log; then
            echo "OVMF TEST PASSED: bridge brought up XHCI"
          else
            echo "OVMF TEST FAILED: XHCI bring-up success not reported"
            echo "--- failure signals ---"
            grep -iE "BRIDGE FAULT|ERROR:|#GP|#PF|Exception|panic|Unsupported" /tmp/ovmf.log || true
            exit 1
          fi
